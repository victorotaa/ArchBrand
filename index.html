<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchBrand · Victor Ota</title>
<meta name="description" content="Branding de Victor Ota — método autoral ArchBrand.">
<meta name="theme-color" content="#0F0F10">
<meta name="robots" content="noindex">
<link rel="canonical" href="chronos/">
<meta http-equiv="refresh" content="0; url=chronos/">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230F0F10'/%3E%3Ctext%20x='16'%20y='23'%20font-size='19'%20font-weight='700'%20font-family='sans-serif'%20fill='%23C3A262'%20text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0F10; --gold:#C3A262; --gold-deep:#A5854A;
  --ink:#F7F4E8; --ink-2:#DAC5A5; --ink-3:#8C877D;
  --line:rgba(247,244,232,.10); --line-gold:rgba(195,162,98,.38);
  --display:'Syne',sans-serif; --body:'Red Hat Display',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100svh;display:grid;place-items:center;padding:32px 22px;
  background:radial-gradient(120% 90% at 50% 0%,#1B1B1D 0%,#0F0F10 62%);
  color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-align:center;}
.card{max-width:520px;animation:up .8s var(--ease) both;}
@keyframes up{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);border:1px solid var(--line-gold);border-radius:100px;
  padding:7px 17px;margin-bottom:28px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1.02;
  letter-spacing:-.02em;}
p{margin-top:16px;font-size:15.5px;color:var(--ink-2);}
.go{display:inline-flex;align-items:center;gap:10px;min-height:52px;margin-top:32px;padding:0 28px;
  border-radius:100px;background:var(--gold);color:var(--bg);font-weight:700;font-size:14.5px;
  text-decoration:none;transition:background .2s var(--ease),transform .2s var(--ease);}
.go:hover{background:var(--gold-deep);transform:translateY(-1px);}
.alt{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);}
.alt a{color:var(--ink-2);text-underline-offset:3px;}
.alt a:hover{color:var(--gold);}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}
</style>
</head>
<body>

<main class="card">
  <span class="eyebrow"><span class="dot"></span>Victor Ota · branding</span>
  <h1>Chronos</h1>
  <p>Redirecionando para o documento de marca da Chronos. Se nada acontecer, siga pelo botão abaixo.</p>
  <a class="go" href="chronos/">Ir para a Chronos <span aria-hidden="true">→</span></a>
  <p class="alt">Procurando o <a href="briefing.html">briefing de marca por arquétipos</a>?</p>
</main>

<script>location.replace('chronos/');</script>
</body>
</html>
